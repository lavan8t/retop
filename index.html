<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>retop</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#09090b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,slnt,wdth,wght,GRAD,ROND@6..144,-10..0,25..151,1..1000,100,0..100&display=swap"
      rel="stylesheet"
    />

    <style>
      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow-x: hidden;
        background-color: var(--bg-main, #09090b);
        color: var(--text-main, #ffffff);
      }
      * {
        box-sizing: border-box;
        font-family: 'Google Sans Flex', system-ui, sans-serif;
        -webkit-tap-highlight-color: transparent;
      }
      input,
      textarea,
      select,
      button {
        font-family: 'Google Sans Flex', system-ui, sans-serif;
      }
      @keyframes retopAsciiRise {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 0.5;
          transform: translateY(0);
        }
      }
    </style>
    <link rel="stylesheet" href="/style.css" />
    <link rel="stylesheet" href="/login.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/standalone.tsx"></script>
  </body>
</html>
